name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke
        env:
          CHATGPT_WEB_MCP_TOOLSET: unified
      - run: npm pack --dry-run

  offline-browser-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright-core install chromium
        if: runner.os == 'Windows'
      - run: npm run test:browser
      - run: node --test integration/send-guard.browser.js integration/windows-security.browser.js
