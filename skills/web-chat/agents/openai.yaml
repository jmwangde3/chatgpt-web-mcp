interface:
  display_name: "web-chat Web-First 主脑"
  short_description: "分析设计默认交给 ChatGPT Web，本地 Agent 负责执行"
  default_prompt: "默认隐式调用 $web-chat 处理需要理解、分析、研究、判断、设计、技术选择、根因定位或实施规划的任务。ChatGPT Web 负责决策并给出逐文件 Implementation Spec；本地 Agent 只先收集最少必要事实，再按规格执行和验证。不要先本地设计再仅请网页审阅。项目复用稳定 session_id；新逻辑请求使用新 request_id；恢复始终使用原 task_id。纯确定性本地操作和用户明确要求仅本地执行时不调用。"

dependencies:
  tools:
    - type: "mcp"
      value: "web-chat"
      description: "四工具 Web-First MCP：chat_send、chat_result、chat_history、chat_doctor"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
